<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title id="page-title">Product — Chic by Val</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="images/logo.svg" alt="Chic by Val" class="logo-img"></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html" class="nav-icon-link">Bag <span class="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="product-root" class="product-detail">
      <div class="empty-state">Loading product…</div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <span>© <span class="js-year"></span> Chic by Val. All rights reserved.</span>
    <a href="admin/login.html">Admin login</a>
  </div>
</footer>

<button id="vc-chat-launcher" aria-label="Open chat assistant">💬</button>
<div id="vc-chat-window">
  <div id="vc-chat-header">
    <div>Ask us anything<span class="sub">Usually replies instantly</span></div>
    <button id="vc-chat-close" aria-label="Close chat">×</button>
  </div>
  <div id="vc-chat-body"></div>
  <div id="vc-quick-replies" class="vc-quick-replies"></div>
  <form id="vc-chat-form">
    <input id="vc-chat-input" type="text" placeholder="Type a question…" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/chatbot.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const productId = params.get("id");
  const root = document.getElementById("product-root");
  let currentQty = 1;

  function renderQty(){
    const input = root.querySelector("#qty-input");
    if (input) input.value = currentQty;
  }

  async function loadProduct(){
    if (!productId){
      root.innerHTML = `<div class="empty-state">No product selected. <a href="shop.html">Back to shop →</a></div>`;
      return;
    }
    const p = await fetchProductById(productId);
    if (!p){
      root.innerHTML = `<div class="empty-state">This product could not be found. <a href="shop.html">Back to shop →</a></div>`;
      return;
    }
    document.getElementById("page-title").textContent = p.name + " — Chic by Val";
    const img = p.imageUrl || "https://placehold.co/700x900/e8e0d0/211f1c?text=No+Image";

    root.innerHTML = `
      <div class="gallery"><img src="${img}" alt="${escapeHTML(p.name)}"></div>
      <div>
        <span class="eyebrow">${escapeHTML(p.category || "Apparel")}</span>
        <h1>${escapeHTML(p.name)}</h1>
        <div class="price">${formatPrice(p.price)}</div>
        <p>${escapeHTML(p.description || "")}</p>

        <div class="qty-row">
          <div class="stepper">
            <button type="button" id="qty-minus">−</button>
            <input id="qty-input" type="text" value="1" readonly>
            <button type="button" id="qty-plus">+</button>
          </div>
        </div>

        <div class="detail-actions">
          <button class="btn btn-primary" id="add-to-bag-btn">Add to bag</button>
          ${p.stripeLink ? `<a class="btn btn-clay" href="${p.stripeLink}" target="_blank" rel="noopener">Buy now</a>` : `<span class="badge">Checkout link coming soon</span>`}
        </div>

        <div class="meta-list">
          ${p.size ? `<div><span>Size</span><span>${escapeHTML(p.size)}</span></div>` : ""}
          ${p.material ? `<div><span>Material</span><span>${escapeHTML(p.material)}</span></div>` : ""}
          <div><span>Shipping</span><span>3–7 business days</span></div>
          <div><span>Returns</span><span>Within 14 days</span></div>
        </div>
      </div>`;

    document.getElementById("qty-minus").addEventListener("click", () => { currentQty = Math.max(1, currentQty - 1); renderQty(); });
    document.getElementById("qty-plus").addEventListener("click", () => { currentQty += 1; renderQty(); });
    document.getElementById("add-to-bag-btn").addEventListener("click", () => addToCart(p.id, currentQty));
  }

  loadProduct();
</script>
</body>
</html>
