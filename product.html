<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/chatbot.css"><title>Product | Chic by Val</title></head><body><div class="announcement">Complimentary local pickup in Indian Head, Maryland</div><header class="site-header"><div class="wrap header-inner"><a class="brand" href="index.html"><img src="images/logo.svg" alt="Chic by Val"></a><button class="nav-toggle">Menu</button><nav class="main-nav"><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a href="about.html">Our Story</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a><a class="bag-link" href="cart.html">Bag <span class="cart-count">0</span></a></nav></div></header><main><div class="wrap" id="product-view"><div class="empty-state" style="margin:70px 0">Loading product...</div></div></main><footer class="site-footer"><div class="wrap footer-grid"><div><img class="footer-logo" src="images/logo.svg" alt="Chic by Val"></div><div><h3>Explore</h3><a href="shop.html">Shop</a></div><div><h3>Help</h3><a href="faq.html">FAQ</a></div><div><h3>Contact</h3><a href="contact.html">Contact</a></div></div><div class="wrap footer-bottom"><span>&copy; <span class="js-year"></span> Chic by Val</span></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/main.js"></script><script src="js/chatbot.js"></script><script>(async()=>{const p=await fetchProductById(new URLSearchParams(location.search).get("id"));const el=document.getElementById("product-view");if(!p){el.innerHTML='<div class="empty-state" style="margin:70px 0">Product not found. <a class="text-link" href="shop.html">Return to shop</a></div>';return}document.title=p.name+" | Chic by Val";el.innerHTML='<article class="product-detail"><div class="gallery"><img src="'+escapeHTML(p.image_url||"images/chic-by-val-hero.png")+'" alt="'+escapeHTML(p.name)+'"></div><div><p class="eyebrow">'+escapeHTML(p.category||"Collection")+'</p><h1 style="font-size:clamp(2.5rem,5vw,4.8rem)">'+escapeHTML(p.name)+'</h1><div class="price">'+formatPrice(p.price)+'</div><p>'+escapeHTML(p.description||"")+'</p><div class="meta-list"><div><span>Sizes</span><b>'+escapeHTML(p.sizes||"Ask Valerie")+'</b></div><div><span>Material</span><b>'+escapeHTML(p.material||"See description")+'</b></div></div><div class="detail-actions"><button class="btn btn-outline" onclick="addToCart(\''+p.id+'\',1)">Add to bag</button>'+(p.stripe_link?'<a class="btn btn-primary" rel="noopener" href="'+escapeHTML(p.stripe_link)+'">Buy securely</a>':'<a class="btn btn-primary" href="contact.html">Ask to purchase</a>')+'</div></div></article>'})();</script></body></html>
