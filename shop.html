<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Shop — Chic by Val</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="images/logo.svg" alt="Chic by Val" class="logo-img"></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html" class="nav-icon-link">Bag <span class="cart-count">0</span></a>
    </nav>
  </div>
</header>

<main>
  <section class="section" style="padding-bottom:20px;">
    <div class="wrap">
      <div class="section-head">
        <div>
          <span class="eyebrow">Full collection</span>
          <h1 class="mt-0">Shop</h1>
        </div>
        <select id="category-filter" style="padding:10px 14px; border:1px solid var(--line); border-radius:2px; background:var(--card); font:inherit;">
          <option value="">All categories</option>
        </select>
      </div>
      <div id="shop-grid" class="product-grid">
        <div class="empty-state">Loading products…</div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <span>© <span class="js-year"></span> Chic by Val. All rights reserved.</span>
    <a href="admin/login.html">Admin login</a>
  </div>
</footer>

<button id="vc-chat-launcher" aria-label="Open chat assistant">💬</button>
<div id="vc-chat-window">
  <div id="vc-chat-header">
    <div>Ask us anything<span class="sub">Usually replies instantly</span></div>
    <button id="vc-chat-close" aria-label="Close chat">×</button>
  </div>
  <div id="vc-chat-body"></div>
  <div id="vc-quick-replies" class="vc-quick-replies"></div>
  <form id="vc-chat-form">
    <input id="vc-chat-input" type="text" placeholder="Type a question…" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/chatbot.js"></script>
<script>
  renderProductGrid("shop-grid");

  // Populate category dropdown once, then re-filter grid on change
  fetchAllProducts().then(products => {
    const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
    const sel = document.getElementById("category-filter");
    cats.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  });

  document.getElementById("category-filter").addEventListener("change", (e) => {
    renderProductGrid("shop-grid", { category: e.target.value || null });
  });
</script>
</body>
</html>
