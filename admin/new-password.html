<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../images/chic-by-val-logo.jpg" type="image/jpeg"><link rel="stylesheet" href="../css/style.css"><title>Choose New Password | Chic by Val</title></head><body><main class="narrow-card"><a href="../index.html"><img src="../images/chic-by-val-logo.jpg" class="logo-img" alt="Chic by Val"></a><p class="eyebrow" style="margin-top:28px">Account recovery</p><h1 style="font-size:2.5rem">Choose a new password.</h1><p>Use at least 12 characters with uppercase and lowercase letters, a number, and a symbol.</p><form id="password-form"><div class="form-field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="12" autocomplete="new-password" required></div><div class="form-field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="12" autocomplete="new-password" required></div><p id="password-message" class="form-hint">Open this page using the link sent to your email.</p><button class="btn btn-primary btn-block">Save new password</button></form><p class="form-hint"><a href="login.html">&larr; Return to login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script>
let recoveryReady=false;storeDB.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"||session){recoveryReady=true;document.getElementById("password-message").textContent="Recovery link accepted. Enter your new password."}});
document.getElementById("password-form").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("password-message"),a=document.getElementById("new-password").value,b=document.getElementById("confirm-password").value;if(a!==b){m.className="form-error";m.textContent="The passwords do not match.";return}if(!recoveryReady){m.className="form-error";m.textContent="This reset link is invalid or expired. Request a new one from the login page.";return}const {error}=await storeDB.auth.updateUser({password:a});if(error){m.className="form-error";m.textContent=error.message}else{m.className="form-success";m.textContent="Password changed. Sending you to the dashboard...";setTimeout(()=>location.href="dashboard.html",1200)}};
</script></body></html>
