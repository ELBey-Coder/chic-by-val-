<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><title>Owner Login | Chic by Val</title></head><body><main class="narrow-card"><a href="../index.html"><img src="../images/logo.svg" class="logo-img" alt="Chic by Val"></a><p class="eyebrow" style="margin-top:28px">Private owner access</p><h1 style="font-size:2.7rem">Welcome back, Valerie.</h1><p>Sign in to add, edit, hide, or remove products.</p><div id="setup-note" class="form-hint"></div><form id="login-form"><div class="form-field"><label for="email">Email</label><input id="email" type="email" value="achuval@yahoo.com" autocomplete="username" required></div><div class="form-field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><p id="login-error" class="form-error"></p><button class="btn btn-primary btn-block">Sign in</button></form><p class="form-hint"><a href="../index.html">&larr; Return to the shop</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script>if(!supabaseReady)document.getElementById("setup-note").textContent="Setup required: add the Supabase URL and public key in js/supabase-config.js before signing in.";else storeDB.auth.getSession().then(({data})=>{if(data.session)location.href="dashboard.html"});document.getElementById("login-form").onsubmit=async e=>{e.preventDefault();const error=document.getElementById("login-error");error.textContent="";if(!storeDB){error.textContent="Supabase has not been connected yet.";return}const result=await storeDB.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(result.error)error.textContent="Sign-in failed. Check the email and password.";else location.href="dashboard.html"};</script></body></html>
