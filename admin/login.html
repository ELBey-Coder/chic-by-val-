<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../images/chic-by-val-logo.jpg" type="image/jpeg"><link rel="stylesheet" href="../css/style.css"><title>Owner Login | Chic by Val</title></head><body><main class="narrow-card"><a href="../index.html"><img src="../images/chic-by-val-logo.jpg" class="logo-img" alt="Chic by Val"></a><p class="eyebrow" style="margin-top:28px">Private owner access</p><h1 style="font-size:2.7rem">Welcome back, Val.</h1><p>Sign in to add, edit, hide, or remove products.</p><div id="setup-note" class="form-hint"></div><form id="login-form"><div class="form-field"><label for="email">Email</label><input id="email" type="email" value="achuval@yahoo.com" autocomplete="username" required></div><div class="form-field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><p id="login-error" class="form-error"></p><button class="btn btn-primary btn-block">Sign in</button></form><p style="text-align:center"><button id="forgot-toggle" type="button" class="text-link" style="background:none;border:0;cursor:pointer">Forgot your password?</button></p><form id="forgot-form" style="display:none;border-top:1px solid #e7ddd3;padding-top:20px"><div class="form-field"><label for="recovery-email">Account email</label><input id="recovery-email" type="email" value="achuval@yahoo.com" required></div><p id="recovery-message" class="form-hint"></p><button class="btn btn-outline btn-block">Send reset email</button></form><p class="form-hint"><a href="../index.html">&larr; Return to the shop</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script>
if(!supabaseReady)document.getElementById("setup-note").textContent="Supabase is not connected.";else storeDB.auth.getSession().then(({data})=>{if(data.session)location.href="dashboard.html"});
document.getElementById("login-form").onsubmit=async e=>{e.preventDefault();const error=document.getElementById("login-error");error.textContent="";if(!storeDB){error.textContent="Supabase is not connected.";return}const {error:signInError}=await storeDB.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(signInError){error.textContent=signInError.message==="Email not confirmed"?"The email account is not confirmed in Supabase.":"Login failed: "+signInError.message}else location.href="dashboard.html"};
document.getElementById("forgot-toggle").onclick=()=>{const f=document.getElementById("forgot-form");f.style.display=f.style.display==="none"?"block":"none"};
document.getElementById("forgot-form").onsubmit=async e=>{e.preventDefault();const message=document.getElementById("recovery-message"),email=document.getElementById("recovery-email").value.trim();message.className="form-hint";message.textContent="Sending...";const redirectTo=new URL("new-password.html",location.href).href;const {error}=await storeDB.auth.resetPasswordForEmail(email,{redirectTo});if(error){message.className="form-error";message.textContent=error.message}else{message.className="form-success";message.textContent="Check the email inbox and spam folder for the password reset link."}};
</script></body></html>
