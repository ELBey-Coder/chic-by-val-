<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><title>Add Product | Chic by Val Admin</title></head><body><div class="admin-shell"><aside class="admin-side"><img src="../images/logo.svg" alt="Chic by Val" class="logo-img"><nav><a href="dashboard.html">Products</a><a class="active" href="add-edit-product.html">Add product</a><a href="../index.html" target="_blank">View store &#8599;</a></nav><button class="signout" onclick="adminSignOut()">Sign out <span class="admin-user-email"></span></button></aside><main class="admin-main"><div class="admin-top"><div><p class="eyebrow" id="form-label">New listing</p><h1 id="form-title" style="font-size:3rem">Add a product</h1><p>Valerie controls every photo, price and description shown in the store.</p></div></div><form id="product-form"><div class="admin-form-grid"><div class="form-field full"><label>Product photo *</label><div class="image-drop" id="image-drop" onclick="document.getElementById('image-input').click()"><img id="image-preview" alt="" style="display:none"><span id="image-label">Choose a JPG, PNG or WebP photo (maximum 5 MB)</span></div><input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" hidden></div><div class="form-field"><label for="p-name">Product name *</label><input id="p-name" required placeholder="Merlot Evening Dress"></div><div class="form-field"><label for="p-category">Category *</label><select id="p-category" required><option>Dresses</option><option>Sets</option><option>Tops</option><option>Bottoms</option><option>Accessories</option></select></div><div class="form-field"><label for="p-price">Price *</label><input id="p-price" type="number" min="0" step=".01" required></div><div class="form-field"><label for="p-sizes">Available sizes</label><input id="p-sizes" placeholder="S, M, L, XL"></div><div class="form-field"><label for="p-material">Material</label><input id="p-material" placeholder="Stretch crepe"></div><div class="form-field"><label for="p-stripe">Stripe Payment Link</label><input id="p-stripe" type="url" placeholder="https://buy.stripe.com/..."><p class="form-hint">Create this in Stripe, then paste the link here.</p></div><div class="form-field full"><label for="p-description">Product description *</label><textarea id="p-description" required placeholder="Describe the fit, feel, styling and special details."></textarea></div><div class="form-field"><label><input id="p-active" type="checkbox" checked style="width:auto"> Show this product in the shop</label></div><div class="form-field"><label><input id="p-featured" type="checkbox" style="width:auto"> Feature on the homepage</label></div></div><p id="product-error" class="form-error"></p><div style="display:flex;gap:10px"><button id="save-button" class="btn btn-primary">Publish product</button><a class="btn btn-outline" href="dashboard.html">Cancel</a></div></form></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/products.js"></script><script src="js/admin-auth.js"></script><script src="js/admin-products.js"></script><script>
const id=new URLSearchParams(location.search).get("id");let selectedFile=null,existingImage="";
document.getElementById("image-input").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert("Please choose an image smaller than 5 MB.");return}selectedFile=f;const img=document.getElementById("image-preview");img.src=URL.createObjectURL(f);img.style.display="block";document.getElementById("image-label").textContent=f.name};
async function loadEdit(){if(!id)return;document.getElementById("form-label").textContent="Edit listing";document.getElementById("form-title").textContent="Edit product";document.getElementById("save-button").textContent="Save changes";const {data:p,error}=await storeDB.from("products").select("*").eq("id",id).single();if(error)return;["name","category","price","sizes","material","description"].forEach(k=>document.getElementById("p-"+k).value=p[k]||"");document.getElementById("p-stripe").value=p.stripe_link||"";document.getElementById("p-active").checked=p.active;document.getElementById("p-featured").checked=p.featured;existingImage=p.image_url||"";if(existingImage){const img=document.getElementById("image-preview");img.src=existingImage;img.style.display="block";document.getElementById("image-label").textContent="Click to replace photo"}}
(async()=>{if(await requireAdmin())loadEdit()})();
document.getElementById("product-form").onsubmit=async e=>{e.preventDefault();const error=document.getElementById("product-error"),btn=document.getElementById("save-button");error.textContent="";if(!selectedFile&&!existingImage){error.textContent="Please choose a product photo.";return}btn.disabled=true;btn.textContent="Saving...";try{const image_url=selectedFile?await uploadProductImage(selectedFile):existingImage;await saveProduct(id,{name:document.getElementById("p-name").value.trim(),category:document.getElementById("p-category").value,price:Number(document.getElementById("p-price").value),sizes:document.getElementById("p-sizes").value.trim(),material:document.getElementById("p-material").value.trim(),stripe_link:document.getElementById("p-stripe").value.trim()||null,description:document.getElementById("p-description").value.trim(),active:document.getElementById("p-active").checked,featured:document.getElementById("p-featured").checked,image_url});location.href="dashboard.html"}catch(x){console.error(x);error.textContent=x.message||"The product could not be saved.";btn.disabled=false;btn.textContent=id?"Save changes":"Publish product"}};
</script></body></html>
